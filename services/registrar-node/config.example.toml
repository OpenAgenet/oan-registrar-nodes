[server]
host = "127.0.0.1"
port = 8001
endpoint = "http://localhost:8001"

[cors]
allowed_origins = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "https://openagenet.github.io",
  "https://openagenet.github.io/oan-site",
]


[upstream]
root_endpoint = "http://localhost:8000"

[security.upstream]
root_did = "did:oan:QwErT:7YpQm9Kx2VnRb6Ts3WfHa4Cd5Ej8LgNz"


[stats_report]
enabled = false
node_id = "registrar-official"
endpoint = "http://localhost:8787/api/internal/node-stats/report"
token = "change-me"
interval_seconds = 60

[paths]
data_dir = "../../data/registrar"
records_dir = "../../data/registrar/resource-records"
identity_file = "../../data/registrar/identity.json"
controller_authorization_nonce_file = "../../data/registrar/controller-authorization-nonces.json"
registration_credential_query_nonce_file = "../../data/registrar/registration-credential-query-nonces.json"
database_url = "postgres://postgres:postgres@127.0.0.1:5432/oan_registrar"

# Optional runtime overrides; omitted values preserve the previous node defaults.
[runtime.tokio]
thread_stack_size_mib = 8

[runtime.did_verification]
worker_count = 6
queue_capacity = 12
worker_stack_size_mib = 16

# Backend-specific defaults: PostgreSQL 8 connections; SQLite 32; acquire timeout 30s.
# [database.pool]
# max_connections = 8
# acquire_timeout_seconds = 30
